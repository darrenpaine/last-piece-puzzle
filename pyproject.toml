[project]
name = "last-piece-puzzle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Darren Paine", email = "darren_paine@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
last-piece-puzzle = "last_piece_puzzle:main"
last-piece-scan = "last_piece_puzzle.scan:main"

[project.optional-dependencies]
scan = [
    "anthropic>=2.3.0",
    "google-genai>=2.33.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-p", "pytester"]
filterwarnings = [
    # google-genai on Python 3.14; not ours to fix
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types",
]
markers = [
    "spec(spec_id, *item_ids): links a test to spec ids, e.g. spec(\"SPEC-0001\", \"AT-0001\")",
    "slow: long-running test; CI skips it with -m \"not slow\"",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ANN"]

[tool.mypy]
strict = true
files = ["src", "tests"]
